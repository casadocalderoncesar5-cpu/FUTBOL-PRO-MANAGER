spring.application.name=api-rest-mongo

# Puerto configurado por defecto en 8091 (Permite sobreescritura con la variable de entorno PORT)
server.port=${PORT:8091}

# Conexión MongoDB / Atlas configurable vía variable de entorno MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://casadocalderoncesar5_db_user:CJCC182003x@casadopc.v9a8hgi.mongodb.net/futbol_db?retryWrites=true&w=majority}
spring.data.mongodb.database=futbol_db
spring.data.mongodb.auto-index-creation=true

# Formato JSON ordenado para respuestas legibles
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Bogota

# Thymeleaf para la interfaz visual de consumo fetch
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
